name: Build and Release
permissions:
  contents: write
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: websrc/go-cache-webpanel/
        run: npm install
      - name: Build Vue project
        working-directory: websrc/go-cache-webpanel/
        run: npm run build-only
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: websrc/go-cache-webpanel/dist/

  build-go:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: websrc/go-cache-webpanel/dist/
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Go binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="gocatch-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          # Build with ldflags to strip and optimize
          go build -v -ldflags="-s -w" -o "${BINARY_NAME}" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gocatch-${{ matrix.os }}-${{ matrix.arch }}
          path: gocatch-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-go
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure of downloaded files
        run: ls -R artifacts
      - name: Prepare release files
        run: |
          mkdir release
          find artifacts -name "gocatch-*" -exec cp {} release/ \;
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
